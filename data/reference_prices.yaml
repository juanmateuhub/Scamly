# Average second-hand prices in Spain for frequently scammed products.
# APPROXIMATE STARTING VALUES: review against real listings before publishing metrics.
# Aliases and exclude words are matched on the title, lowercase and without accents.
# Order matters: put specific models before generic ones.

skip_words:            # in the TITLE only: the listing is not the product itself
  - funda
  - carcasa
  - protector
  - cargador
  - solo caja
  - caja vacia
  - pegatina
  - busco
  - compro

defect_phrases:        # in title OR description: a defect explains a low price
  - para piezas
  - averiada
  - averiado
  - no funciona
  - pantalla rota
  - no carga
  - no enciende
  - tiene un fallo
  - por eso el precio

conditions:            # platform condition text -> level
  sin abrir: nuevo                       # Wallapop
  nuevo: nuevo
  como nuevo: como_nuevo
  en buen estado: buen_estado
  en condiciones aceptables: aceptable
  lo ha dado todo: danado
  nuevo con etiquetas: nuevo             # Vinted
  nuevo sin etiquetas: nuevo
  muy bueno: como_nuevo
  bueno: buen_estado
  satisfactorio: aceptable

wear_phrases:          # wear named in the text: condition at best "aceptable"
  - arañazo
  - arañazos
  - rayado
  - rayada
  - rayones
  - golpe
  - golpes
  - desgaste
  - desgastado
  - desgastada
  - marcas de uso
  - desconchado
  - abolladura
  - mancha
  - manchas

variant_words:         # a comparable must have exactly the same ones as the listing
  - pro
  - max
  - plus
  - mini
  - ultra
  - air
  - digital
  - lite
  - oled
  - lcd
  - fe
  - 16e
  - 17e

products:
  - name: PS5 Digital
    category: consolas
    price_eur: 330
    aliases: [ps5 digital, playstation 5 digital, play 5 digital, play5 digital]
  - name: PS5
    category: consolas
    price_eur: 400
    aliases: [ps5, playstation 5, play 5, play5]
    exclude: [digital, pro, mando, juego, "juegos ps5", "juegos de ps5", "juegos para ps5"]
  - name: Nintendo Switch 2
    category: consolas
    price_eur: 380
    aliases: [switch 2]
  - name: Nintendo Switch OLED
    category: consolas
    price_eur: 220
    aliases: [switch oled]
  - name: Steam Deck OLED
    category: consolas
    price_eur: 450
    aliases: [steam deck oled]
  - name: iPhone 15 Pro
    category: moviles
    price_eur: 650
    aliases: [iphone 15 pro]
    exclude: [max]
  - name: iPhone 15
    category: moviles
    price_eur: 500
    aliases: [iphone 15]
    exclude: [pro, plus]
  - name: iPhone 16
    category: moviles
    price_eur: 620
    aliases: [iphone 16]
    exclude: [pro, plus, "16e"]
  - name: AirPods Pro 2
    category: audio
    price_eur: 140
    aliases: [airpods pro 2, airpods pro segunda generacion]
  - name: Nike Dunk Low
    category: zapatillas
    price_eur: 90
    aliases: [dunk low]

categories: {}         # fallback average per category (confidence 0.6); empty for now
