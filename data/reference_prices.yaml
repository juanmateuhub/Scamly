# Average second-hand prices in Spain for frequently scammed products.
# APPROXIMATE STARTING VALUES. Entries marked "median of N real listings" come from the
# similar listings collected with the real split (titles and prices only); the rest are still
# estimates. PS5, Switch and AirPods were not updated: their searches mix games, accessories
# and replicas, so the median is not the product's price.
# Aliases and exclude words are matched on the title, lowercase and without accents.
# Order matters: put specific models before generic ones.

skip_words:            # in the TITLE only: the listing is not the product itself
  - funda
  - carcasa
  - protector
  - cargador
  - solo caja
  - caja vacia
  - pegatina
  - busco
  - compro

defect_phrases:        # in title OR description: a defect explains a low price
  - para piezas
  - averiada
  - averiado
  - no funciona
  - pantalla rota
  - no carga
  - no enciende
  - tiene un fallo
  - por eso el precio

conditions:            # platform condition text -> level
  sin abrir: nuevo                       # Wallapop
  nuevo: nuevo
  como nuevo: como_nuevo
  en buen estado: buen_estado
  en condiciones aceptables: aceptable
  lo ha dado todo: danado
  nuevo con etiquetas: nuevo             # Vinted
  nuevo sin etiquetas: nuevo
  muy bueno: como_nuevo
  bueno: buen_estado
  satisfactorio: aceptable

wear_phrases:          # wear named in the text: condition at best "aceptable"
  - arañazo
  - arañazos
  - rayado
  - rayada
  - rayones
  - golpe
  - golpes
  - desgaste
  - desgastado
  - desgastada
  - marcas de uso
  - desconchado
  - abolladura
  - mancha
  - manchas

variant_words:         # a comparable must have exactly the same ones as the listing
  - pro
  - max
  - plus
  - mini
  - ultra
  - air
  - digital
  - lite
  - oled
  - lcd
  - fe
  - 16e
  - 17e

