[project]
name = "scamly-backend"
version = "0.1.0"
description = "Risk scoring API for second-hand marketplace listings"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "uvicorn[standard]==0.54.0",
    "pyyaml==6.0.3",
    "slowapi==0.1.10",    # per-IP rate limit on /analyze (each call may spend LLM quota)
    "httpx==0.28.1",      # HTTP client for the LLM API (already needed by the test client)
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",     # backend for starlette.testclient (httpx there is deprecated)
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261030",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
