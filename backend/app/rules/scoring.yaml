# Scoring parameters (see "Motor de puntuación de riesgo" in CLAUDE.md).
# Starting values; tune them with data/eval/listings.jsonl.

levels:            # lower bound of each traffic-light level (0-100)
  amarillo: 20     # calibrated on the dev split (2026-11-02): no scam left green
  rojo: 35         # no legitimate listing reaches red on dev (max legit score 33)

min_reason_points: 3         # risk reasons below this contribution are hidden in the panel
min_mitigator_reduction: 0.05 # mitigators below this effect (fraction) are hidden

text_confidence:   # how much we trust each text-analysis source
  llm: 0.9         # LLM with a quote verified in the listing
  regex: 0.8       # Spanish phrase rules only (plan B)
  both: 1.0        # LLM and rules agree

signals:           # risk signals: points = weight * intensity * confidence
  precio_anomalo:
    weight: 55               # 40 -> 55 (2026-11-02): with live comparables a big drop must count
    ratio_no_risk: 0.75      # price / reference at or above this -> intensity 0
    ratio_max_risk: 0.25     # price / reference at or below this -> intensity 1
    confidence_product: 1.0  # matched a specific product
    confidence_category: 0.6 # only matched a category average
    comparables:             # same product listed now, found by the extension's search
      min_count: 5           # fewer similar listings -> reference table instead
      full_count: 15         # similar listings for full confidence
      max_confidence: 0.9    # times (1 - IQR / median): scattered prices are trusted less
    condition_factors:       # price intensity multiplier: worn items can be cheap for a reason
      nuevo: 1.0
      como_nuevo: 1.0
      buen_estado: 0.85
      aceptable: 0.6
      danado: 0.3
      desconocido: 0.85
  cuenta_nueva:
    weight: 15
    decay_days: 30           # intensity = exp(-days / decay_days)
  sin_historial:
    weight: 10
    half_count: 3            # intensity = 1 / (1 + (ratings + sales) / half_count)
  malas_valoraciones:
    weight: 20
    full_count: 10           # ratings needed for full evidence
    avg_ok: 3.5              # average at or above -> intensity 0
    avg_bad: 2.0             # average at or below -> intensity 1
  descripcion_pobre:
    weight: 15
    full_risk_words: 5       # description words at or below -> intensity 1
    no_risk_words: 30        # at or above -> intensity 0
  pago_fuera_app:
    weight: 40
  contacto_externo:
    weight: 25
  urgencia:
    weight: 10
  solo_foto:                 # sells a picture of the item, not the item: red on its own
    weight: 60
  texto_generico:            # LLM-only signal (phase 5)
    weight: 10
    confidence: 0.7

mitigators:        # risk *= (1 - max_reduction * intensity * confidence)
  vendedor_con_historial:
    max_reduction: 0.30
    full_count: 50           # ratings needed for full effect
    avg_floor: 4.0           # average at or below -> no effect
    avg_ceiling: 5.0         # average at or above -> full effect
  envio_protegido:
    max_reduction: 0.15
