name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts

      - name: Mypy
        run: mypy app tests ../scripts/evaluate.py ../scripts/import_real.py ../scripts/make_icons.py ../scripts/screenshots.py

      # No .env in CI: the LLM is disabled and every test runs offline (rules + fake LLM).
      - name: Pytest
        run: pytest -q --cov --cov-report=term-missing

      - name: Evaluation (rules only, held-out test split)
        working-directory: .
        run: python scripts/evaluate.py --split test

  extension:
    name: Extension (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image (build, health, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No .env in CI: the image runs with phrase rules only.
      - name: Build and start (waits for the healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 90

      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/health
          echo
          body='{"platform": "wallapop", "listing_id": "ci-ps5", "title": "PS5 nueva precintada",
                 "description": "Me voy del país, solo Bizum, escríbeme por WhatsApp",
                 "price_eur": 180, "category": "consolas",
                 "seller": {"account_age_days": 3, "ratings_count": 0, "sales_count": 0},
                 "shipping_available": false, "image_count": 2}'
          result=$(curl -fsS -X POST http://127.0.0.1:8000/analyze \
            -H 'Content-Type: application/json' -d "$body")
          echo "$result" | jq '{risk_score, level, reasons: [.reasons[].signal]}'
          test "$(echo "$result" | jq -r .level)" = "rojo"

      - name: Runs as a non-root user
        run: test "$(docker compose exec -T backend id -u)" != "0"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
