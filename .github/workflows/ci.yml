name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts

      - name: Mypy
        run: mypy app tests ../scripts/evaluate.py ../scripts/make_icons.py

      # No .env in CI: the LLM is disabled and every test runs offline (rules + fake LLM).
      - name: Pytest
        run: pytest -q --cov --cov-report=term-missing

      - name: Evaluation (rules only, held-out test split)
        working-directory: .
        run: python scripts/evaluate.py --split test

  extension:
    name: Extension (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
